<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteo Gran Final Monte Tabor 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#0a2342 0%,#1a4a7a 50%,#0d3b6e 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;color:white}
.header{text-align:center;margin-bottom:30px}
.header h1{font-size:2.2em;font-weight:900;text-shadow:2px 2px 8px rgba(0,0,0,0.5)}
.header p{font-size:1.1em;opacity:0.85;margin-top:6px}
.stats{display:flex;gap:20px;margin-bottom:25px;flex-wrap:wrap;justify-content:center}
.stat-box{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:12px;padding:14px 24px;text-align:center}
.stat-box .num{font-size:2em;font-weight:900;color:#FFD700}
.stat-box .label{font-size:0.8em;opacity:0.8;margin-top:2px}
.drum-container{background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2);border-radius:20px;padding:30px;width:100%;max-width:680px;text-align:center;margin-bottom:20px}
.drum-screen{background:rgba(0,0,0,0.35);border-radius:14px;padding:28px 20px;margin-bottom:22px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.1)}
.rolling{font-size:1.6em;font-weight:700;color:#FFD700;animation:pulse 0.15s infinite alternate}
.winner-name{font-size:2.4em;font-weight:900;color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,0.6);line-height:1.2}
.winner-sub{font-size:0.95em;opacity:0.75;margin-top:8px}
.waiting{font-size:1.2em;opacity:0.5}
@keyframes pulse{from{opacity:0.6;transform:scale(0.97)}to{opacity:1;transform:scale(1.03)}}
.btn-sortear{background:linear-gradient(135deg,#FFD700,#FFA500);color:#0a2342;font-size:1.4em;font-weight:900;padding:16px 48px;border:none;border-radius:50px;cursor:pointer;box-shadow:0 6px 20px rgba(255,165,0,0.4);transition:all 0.2s}
.btn-sortear:hover{transform:scale(1.05)}
.btn-sortear:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.verify-box{width:100%;max-width:680px;border-radius:16px;padding:26px 28px;margin-bottom:18px;display:none}
.verify-box.green{background:linear-gradient(135deg,#1a7a1a,#28a428);border:3px solid #4cff4c}
.verify-box.red{background:linear-gradient(135deg,#7a1a1a,#b02020);border:3px solid #ff6b6b}
.box-title{font-size:1.5em;font-weight:900;margin-bottom:12px}
.box-msg{font-size:1.1em;line-height:1.6}
.action-buttons{display:none;gap:14px;width:100%;max-width:680px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.btn-confirm{background:linear-gradient(135deg,#1a9a1a,#22cc22);color:white;font-size:1.1em;font-weight:800;padding:16px 30px;border:none;border-radius:50px;cursor:pointer;transition:all 0.2s;flex:1;min-width:240px}
.btn-confirm:hover{transform:scale(1.04)}
.btn-retry{background:linear-gradient(135deg,#8a1515,#cc2222);color:white;font-size:1.1em;font-weight:800;padding:16px 30px;border:none;border-radius:50px;cursor:pointer;transition:all 0.2s;flex:1;min-width:240px}
.btn-retry:hover{transform:scale(1.04)}
.winner-final{display:none;width:100%;max-width:680px;background:linear-gradient(135deg,#0a4a0a,#0f700f);border:3px solid #4cff4c;border-radius:20px;padding:30px;text-align:center;animation:popIn 0.5s ease}
@keyframes popIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.winner-final h2{font-size:2em;color:#FFD700;margin-bottom:10px}
.w-name{font-size:2.6em;font-weight:900;color:white;margin-bottom:8px}
.winner-final p{font-size:1.1em;opacity:0.85}
.excluded-info{margin-top:16px;font-size:0.85em;opacity:0.55}
.badge{display:inline-block;background:rgba(255,215,0,0.2);border:1px solid rgba(255,215,0,0.5);border-radius:20px;padding:3px 12px;font-size:0.8em;color:#FFD700;margin-top:6px}
</style>
</head>
<body>
<div class="header">
  <h1>&#127956; SORTEO GRAN FINAL</h1>
  <p>Monte Tabor 2026 &middot; Playablanca Resort &amp; Magma Lodge</p>
</div>
<div class="stats">
  <div class="stat-box"><div class="num" id="numP">0</div><div class="label">Participantes</div></div>
  <div class="stat-box"><div class="num" id="numT">0</div><div class="label">Tickets totales</div></div>
  <div class="stat-box"><div class="num" id="numR">0</div><div class="label">Rondas</div></div>
</div>
<div class="drum-container">
  <div class="drum-screen" id="screen">
    <div class="waiting">&#127919; Presiona SORTEAR para comenzar</div>
  </div>
  <button class="btn-sortear" id="btnS" onclick="sortear()">&#127920; SORTEAR</button>
  <div class="excluded-info" id="excInfo"></div>
</div>
<div class="verify-box" id="vBox">
  <div class="box-title" id="vTitle"></div>
  <div class="box-msg" id="vMsg"></div>
</div>
<div class="action-buttons" id="actBtns">
  <button class="btn-confirm" onclick="confirmar()">&#9989; Confirmar Ganador</button>
  <button class="btn-retry" onclick="noDemuestra()">&#10060; No puede demostrar - Nuevo Sorteo</button>
</div>
<div class="winner-final" id="wFinal">
  <h2>&#127942; GANADOR OFICIAL!</h2>
  <div class="w-name" id="wName"></div>
  <p id="wDetail"></p>
</div>
<script>
var P=[{n:"Constanza",a:"Boetsch",pb:true,mg:true}];
function tickets(p){return(p.pb&&p.mg)?3:p.pb?2:1;}
function nombre(p){return p.n+" "+p.a;}
var excl=[],winner=null,rounds=0;
function bombo(){var b=[];P.forEach(function(p,i){if(excl.indexOf(i)===-1){for(var t=0;t<tickets(p);t++)b.push(i);}});return b;}
function stats(){document.getElementById('numP').textContent=P.length;document.getElementById('numT').textContent=P.reduce(function(s,p){return s+tickets(p);},0);document.getElementById('numR').textContent=rounds;}
function sortear(){
  document.getElementById('vBox').style.display='none';
  document.getElementById('actBtns').style.display='none';
  document.getElementById('wFinal').style.display='none';
  var b=bombo();
  if(!b.length){document.getElementById('screen').innerHTML='<div style="color:#ff6b6b;font-size:1.2em">Sin mas participantes</div>';return;}
  document.getElementById('btnS').disabled=true;rounds++;stats();
  var c=0,max=30+Math.floor(Math.random()*25),scr=document.getElementById('screen');
  var iv=setInterval(function(){
    var ri=b[Math.floor(Math.random()*b.length)];
    scr.innerHTML='<div class="rolling">'+nombre(P[ri])+'</div>';c++;
    if(c>=max){clearInterval(iv);
      var wi=b[Math.floor(Math.random()*b.length)];winner=P[wi];
      var t=tickets(winner),badge=t===3?'Triple chance':t===2?'Doble chance':'1 ticket';
      scr.innerHTML='<div class="winner-name">'+nombre(winner)+'</div><div class="winner-sub"><span class="badge">'+badge+'</span></div>';
      verificar(winner);}
  },80);
}
function verificar(p){
  var box=document.getElementById('vBox'),t=tickets(p);
  if(t===1){box.className='verify-box green';document.getElementById('vTitle').innerHTML='&#9989; SIN VERIFICACION';document.getElementById('vMsg').textContent='Este participante no marco seguir ninguna cuenta. No hay nada que verificar - es el ganador!';}
  else if(t===3){box.className='verify-box red';document.getElementById('vTitle').innerHTML='&#127755; TRIPLE CHANCE - VERIFICAR';document.getElementById('vMsg').textContent='Pidele que muestre su telefono: debe seguir @playablancaresort Y @magmalodge en Instagram. Si no puede demostrarlo, sortea de nuevo.';}
  else{box.className='verify-box red';document.getElementById('vTitle').innerHTML='&#127958; DOBLE CHANCE - VERIFICAR';document.getElementById('vMsg').textContent='Pidele que muestre su telefono: debe seguir @playablancaresort en Instagram. Si no puede demostrarlo, sortea de nuevo.';}
  box.style.display='block';document.getElementById('actBtns').style.display='flex';document.getElementById('btnS').disabled=false;
}
function confirmar(){
  document.getElementById('vBox').style.display='none';document.getElementById('actBtns').style.display='none';document.getElementById('btnS').disabled=true;
  document.getElementById('wName').textContent=nombre(winner);
  var t=tickets(winner);document.getElementById('wDetail').textContent=t===3?'Gano con Triple Chance - seguia @playablancaresort y @magmalodge':t===2?'Gano con Doble Chance - seguia @playablancaresort':'Gano con 1 ticket';
  document.getElementById('wFinal').style.display='block';
}
function noDemuestra(){
  var i=P.indexOf(winner);if(excl.indexOf(i)===-1)excl.push(i);winner=null;
  document.getElementById('vBox').style.display='none';document.getElementById('actBtns').style.display='none';
  document.getElementById('excInfo').textContent=excl.length?'Excluidos: '+excl.map(function(j){return P[j].n;}).join(', '):'';
  document.getElementById('screen').innerHTML='<div class="waiting">Preparando nuevo sorteo...</div>';
  setTimeout(sortear,1200);
}
stats();
</script>
</body>
</html>
